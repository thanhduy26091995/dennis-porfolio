# Host system-nginx config for dennisbui.dev (reverse-proxy to the app container).
# The app runs in Docker, bound to 127.0.0.1:3000 (see docker-compose.yml).
#
# Install on the VPS:
#   sudo cp nginx-site.conf /etc/nginx/sites-available/dennisbui.dev
#   sudo ln -s /etc/nginx/sites-available/dennisbui.dev /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d dennisbui.dev -d www.dennisbui.dev
# certbot will automatically add the TLS (443) block and the HTTP→HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name dennisbui.dev www.dennisbui.dev;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
